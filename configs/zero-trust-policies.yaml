# Zero Trust Security Policies
# Unified configuration for zero trust authentication and authorization

# Core zero trust principles
principles:
  verify_explicitly: true        # Always authenticate and authorize
  least_privilege_access: true   # Minimal access rights
  assume_breach: true            # Verify as if already compromised

# Identity verification
identity:
  # Continuous authentication
  continuous_auth: true

  # Re-authentication interval (minutes)
  reauth_interval_minutes: 60

  # Multi-factor authentication
  mfa:
    required: true
    methods:
      - "totp"  # Time-based OTP
      - "webauthn"  # Hardware keys
      - "push"  # Push notifications

  # Passwordless authentication
  passwordless:
    enabled: true
    methods:
      - "webauthn"
      - "ssh-cert"

# Device trust
device:
  # Require device registration
  require_registration: true

  # Device health checks
  health_checks:
    enabled: true
    checks:
      - "os_version"     # OS is up to date
      - "encryption"     # Disk encryption enabled
      - "firewall"       # Firewall active
      - "antivirus"      # AV installed and updated

  # Allowed device platforms
  allowed_platforms:
    - "darwin"  # macOS
    - "linux"

  # Device certificate validation
  certificates:
    required: false
    validate_chain: true

# Network context
network:
  # Trusted networks
  trusted_networks: []
    # Examples:
    # - "192.168.1.0/24"  # Internal network
    # - "10.0.0.0/8"      # Corporate network

  # Untrusted networks (public WiFi, etc.)
  untrusted_networks:
    - "0.0.0.0/0"  # Default: all networks untrusted

  # Network-based access rules
  access_rules:
    # Require VPN from untrusted networks
    require_vpn_on_untrusted: true

    # Block access from certain locations
    blocked_countries: []

    # Geo-fencing
    geo_fencing:
      enabled: false
      allowed_countries: []

# Session management
session:
  # Maximum session duration (minutes)
  max_duration_minutes: 480  # 8 hours

  # Idle timeout (minutes)
  idle_timeout_minutes: 30

  # Session binding
  binding:
    enabled: true
    bind_to:
      - "ip_address"
      - "user_agent"
      - "device_id"

  # Concurrent sessions
  max_concurrent_sessions: 3

  # Session hijacking detection
  hijack_detection:
    enabled: true
    check_ip_change: true
    check_device_change: true

# Access policies
access:
  # Default deny
  default_action: "deny"

  # Require explicit allow rules
  explicit_allow: true

  # Just-in-time access
  jit_access:
    enabled: false
    max_duration_minutes: 60

  # Time-based access control
  time_based:
    enabled: false
    allowed_hours:
      start: "09:00"
      end: "17:00"
    allowed_days:
      - "monday"
      - "tuesday"
      - "wednesday"
      - "thursday"
      - "friday"

# Risk scoring
risk:
  # Enable risk-based authentication
  enabled: true

  # Risk factors
  factors:
    - name: "new_device"
      weight: 0.3
    - name: "new_location"
      weight: 0.3
    - name: "impossible_travel"
      weight: 0.5
    - name: "unusual_time"
      weight: 0.1
    - name: "failed_auth_attempts"
      weight: 0.4

  # Risk thresholds
  thresholds:
    low: 0.3
    medium: 0.5
    high: 0.7

  # Actions based on risk level
  actions:
    low: "allow"
    medium: "challenge_mfa"
    high: "deny"

# Anomaly detection
anomaly_detection:
  enabled: true

  # Detection algorithms
  algorithms:
    - "impossible_travel"
    - "unusual_access_pattern"
    - "suspicious_ip"
    - "brute_force"

  # ML-based detection
  machine_learning:
    enabled: false
    model: "isolation_forest"

# Encryption requirements
encryption:
  # Require TLS for all connections
  require_tls: true

  # Minimum TLS version
  min_tls_version: "1.3"

  # Require mTLS for service-to-service
  require_mtls_for_services: true

  # Encryption at rest
  at_rest:
    required: true
    algorithms:
      - "AES-256"

# Monitoring and logging
monitoring:
  # Enable comprehensive logging
  enabled: true

  # Log authentication attempts
  log_auth_attempts: true

  # Log access requests
  log_access_requests: true

  # Log policy violations
  log_violations: true

  # SIEM integration
  siem:
    enabled: false
    endpoint: ""
    format: "json"

  # Real-time alerting
  alerts:
    enabled: true
    channels:
      - "email"
      - "slack"
      - "syslog"

    conditions:
      - "failed_auth_threshold"
      - "policy_violation"
      - "anomaly_detected"
      - "high_risk_access"

# Compliance and audit
compliance:
  # Compliance frameworks
  frameworks:
    - "NIST_800_207"  # NIST Zero Trust Architecture
    - "NIST_800_53"   # Security and Privacy Controls

  # Audit logging
  audit:
    enabled: true
    retention_days: 365
    immutable: true

  # Regular compliance checks
  compliance_checks:
    enabled: true
    frequency_days: 30

# Integration
integrations:
  # Identity providers
  identity_providers:
    - type: "oidc"
      name: "corporate_idp"
      endpoint: ""
      client_id: ""

  # Certificate authorities
  certificate_authorities: []

  # SIEM/SOAR
  siem_endpoints: []

  # Threat intelligence
  threat_intel:
    enabled: false
    feeds: []
